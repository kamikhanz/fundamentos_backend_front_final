<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Moto Tienda</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header></header>

    <main>
      <section>
        <form id="formRegistro">
          <fieldset>
            <legend>Crear cuenta</legend>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" minlength="3" required />

            <label for="email">Correo:</label>
            <input type="email" id="email" required />

            <label for="password">Contraseña (minimo 8 caracteres):</label>
            <input type="password" id="password" minlength="8" required />

            <br /><br />
            <input type="submit" value="Registrarme" />
          </fieldset>
        </form>

        <a href="login.html">Ya tengo cuenta</a>
      </section>
    </main>

    <footer>
      <p>Proyecto final - Fundamentos de Back End y Front End</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
  </body>
</html>
